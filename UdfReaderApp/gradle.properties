# Bu satır, Gradle'ın bu projeyi derlemek için hangi Java versiyonunu kullanacağını belirtir.
# Android Gradle Plugin'in modern versiyonları Java 11 veya daha yenisini gerektirir.
# Lütfen aşağıdaki yolu kendi bilgisayarınızdaki JDK 11 (veya üstü) kurulumunun yoluyla değiştirin.
# ÖNEMLİ: Ters taksim işaretlerini (\\) çift olarak kullanın.

org.gradle.java.home=C\:\\Program Files\\Java\\jdk-11

# AndroidX kütüphanelerini etkinleştirir. Bu, modern Android projeleri için gereklidir.
android.useAndroidX=true

# Eski destek kütüphanelerini otomatik olarak AndroidX'e dönüştürür.
android.enableJetifier=true
